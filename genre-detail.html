<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音楽ジャンル — 時代 Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--bg2:#0c0e1a;--bg3:#111320;--text:#e8e4d9;--text2:rgba(232,228,217,.5);--text3:rgba(232,228,217,.28);--gold:#c9a84c;--border:rgba(232,228,217,.08);--border2:rgba(232,228,217,.15);--radius:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;padding-bottom:5rem}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;border-bottom:.5px solid var(--border);background:rgba(7,8,15,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:200}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;color:var(--gold)}
.nav-bc{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.nav-bc a{color:rgba(201,168,76,.6)}.nav-bc a:hover{color:var(--gold)}
.nav-bc .sep{color:var(--border2)}
.hero{padding:3rem 2rem 2rem;border-bottom:.5px solid var(--border);position:relative;overflow:hidden}
.hero-wm{position:absolute;right:-10px;top:-10px;font-family:'Shippori Mincho',serif;font-size:110px;font-weight:900;color:rgba(201,168,76,.04);line-height:1;pointer-events:none}
.hero-eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(201,168,76,.55);margin-bottom:.85rem}
.hero-title{font-family:'Shippori Mincho',serif;font-size:clamp(34px,5vw,52px);font-weight:900;line-height:1.1;margin-bottom:.75rem}
.hero-desc{font-size:14px;color:var(--text2);line-height:2;max-width:500px;margin-bottom:1.25rem}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.hero-tag{font-size:10px;padding:3px 12px;border-radius:14px;border:.5px solid rgba(201,168,76,.3);color:rgba(201,168,76,.8)}
/* ジャンル説明バッジ */
.genre-info-bar{background:rgba(201,168,76,.06);border:.5px solid rgba(201,168,76,.15);border-radius:8px;padding:.75rem 1.25rem;font-size:12px;color:var(--text2);line-height:1.7;margin-top:.75rem}
.genre-info-bar strong{color:var(--gold)}
/* TABS */
.explore-tabs{display:flex;gap:0;padding:0 2rem;border-bottom:.5px solid var(--border);background:var(--bg);position:sticky;top:53px;z-index:190}
.etab{font-size:13px;font-weight:700;padding:12px 20px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;font-family:'Zen Kaku Gothic New',sans-serif;letter-spacing:.04em}
.etab:hover{color:var(--text)}
.etab.active{color:var(--gold);border-bottom-color:var(--gold)}
/* おすすめ */
.sub-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 2rem;border-bottom:.5px solid var(--border);background:var(--bg2)}
.sub-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;font-family:'Shippori Mincho',serif;font-size:13px;font-weight:700;padding:10px 16px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap}
.stab:hover{color:var(--text)}
.stab.active{color:var(--gold);border-bottom-color:var(--gold)}
/* artist profile */
.content{padding:1.5rem 2rem}
.sec-lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.sec-lbl::after{content:'';flex:1;height:.5px;background:var(--border)}
.artist-profile{display:flex;gap:1.5rem;align-items:center;padding:1.25rem;background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:1.5rem;flex-wrap:wrap}
.ap-img-wrap{width:80px;height:80px;border-radius:50%;overflow:hidden;flex-shrink:0;border:.5px solid var(--border2);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text3)}
.ap-info{flex:1}
.ap-name{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:3px;cursor:pointer;transition:color .15s;text-decoration:none;display:block}
.ap-name:hover{color:var(--gold)}
.ap-desc{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:.6rem}
.ap-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ap-link{font-size:10px;padding:4px 12px;border-radius:12px;border:.5px solid;cursor:pointer;transition:all .15s;text-decoration:none}
.ap-detail-btn{font-size:11px;padding:6px 14px;border-radius:12px;background:rgba(201,168,76,.15);border:.5px solid rgba(201,168,76,.4);color:var(--gold);cursor:pointer;transition:all .18s;text-decoration:none;font-weight:700;letter-spacing:.04em}
.ap-detail-btn:hover{background:rgba(201,168,76,.25)}
/* albums */
.albums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-bottom:2rem}
.album-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s}
.album-card:hover{border-color:rgba(201,168,76,.4);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.album-jacket{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.album-jacket-ph{width:100%;aspect-ratio:1;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.2}
.album-body{padding:.65rem .75rem}
.album-name{font-family:'Shippori Mincho',serif;font-size:12px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.album-artist{font-size:10px;color:rgba(201,168,76,.6);margin-bottom:2px}
.album-year{font-size:10px;color:var(--text3);margin-bottom:.45rem}
.album-links{display:flex;gap:4px}
.alnk{flex:1;font-size:9px;padding:3px 0;border-radius:3px;border:.5px solid;text-align:center;text-decoration:none;display:block;transition:all .15s}
/* search */
.search-zone{padding:1.25rem 2rem;background:var(--bg2);border-bottom:.5px solid var(--border)}
.search-wrap{display:flex;gap:10px;max-width:560px;margin-bottom:.75rem}
.search-input{flex:1;background:var(--bg);border:.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;padding:10px 16px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:rgba(201,168,76,.5)}
.search-input::placeholder{color:var(--text3)}
.search-btn{background:var(--gold);color:#07080f;border:none;border-radius:8px;padding:10px 20px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.search-btn:hover{background:#e0be6a}
.search-result-item{display:block;padding:.5rem .75rem;background:var(--bg3);border-radius:5px;margin-bottom:4px;text-decoration:none;color:var(--text);font-size:13px;font-family:'Shippori Mincho',serif;font-weight:700;transition:background .15s}
.search-result-item:hover{background:rgba(201,168,76,.1)}
.search-no-result{font-size:12px;color:var(--text3);padding:.5rem 0}
.all-artists-link{font-size:12px;color:rgba(201,168,76,.7);text-decoration:none;display:inline-block;margin-top:.75rem}
.all-artists-link:hover{color:var(--gold)}
/* era */
.era-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:1rem 2rem;border-bottom:.5px solid var(--border);background:var(--bg2)}
.eratab{font-size:12px;font-weight:700;padding:7px 18px;border-radius:20px;border:.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .18s;font-family:'Shippori Mincho',serif}
.eratab:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}
.eratab.active{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.5);color:var(--gold);font-weight:900}
.era-header{background:var(--bg2);border:.5px solid rgba(201,168,76,.15);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.era-header-title{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:.4rem}
.era-header-sub{font-size:12px;color:var(--text2);line-height:1.8}
.era-header-keywords{display:flex;gap:6px;flex-wrap:wrap;margin-top:.75rem}
.era-kw{font-size:10px;padding:2px 9px;border-radius:10px;border:.5px solid rgba(201,168,76,.25);color:rgba(201,168,76,.7)}
/* loading */
.loading{padding:3rem;text-align:center;display:none}
.loading.show{display:block}
.ld-dots{display:flex;gap:6px;justify-content:center;margin-bottom:.75rem}
.ld-dot{width:8px;height:8px;border-radius:50%;background:rgba(201,168,76,.4);animation:ldp 1.2s ease-in-out infinite}
.ld-dot:nth-child(2){animation-delay:.2s}.ld-dot:nth-child(3){animation-delay:.4s}
@keyframes ldp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.ld-text{font-size:12px;color:var(--text3)}
.error-msg{display:none;margin:1rem 0;background:rgba(255,80,80,.07);border:.5px solid rgba(255,80,80,.2);border-radius:var(--radius);padding:.85rem 1rem;font-size:12px;color:rgba(255,120,120,.8);line-height:1.7}
.error-msg.show{display:block}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ===== CAROUSEL (おすすめ) ===== */
.carousel-outer{position:relative;overflow:hidden;background:var(--bg2);border-bottom:.5px solid var(--border)}
.carousel-track{display:flex;gap:0;transition:transform .5s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.carousel-slide{flex-shrink:0;width:100%;display:flex;flex-direction:column}
.carousel-artist-header{display:flex;gap:1.5rem;align-items:center;padding:1.5rem 2rem 1rem;flex-wrap:wrap}
.car-avatar{width:90px;height:90px;border-radius:50%;background:var(--bg3);border:.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:32px;font-weight:700;flex-shrink:0;overflow:hidden}
.car-avatar img{width:100%;height:100%;object-fit:cover}
.car-info{flex:1}
.car-name{font-family:'Shippori Mincho',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:.3rem}
.car-desc{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:.75rem}
.car-links{display:flex;gap:6px;flex-wrap:wrap}
.car-link{font-size:11px;padding:5px 14px;border-radius:12px;border:.5px solid;text-decoration:none;transition:all .15s}
.car-detail-btn{font-size:11px;padding:6px 16px;border-radius:12px;background:rgba(201,168,76,.15);border:.5px solid rgba(201,168,76,.4);color:var(--gold);text-decoration:none;font-weight:700;transition:all .18s}
.car-detail-btn:hover{background:rgba(201,168,76,.25)}
.car-albums{padding:0 2rem 1.5rem}
.car-albums-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.car-albums-label::after{content:'';flex:1;height:.5px;background:var(--border)}
.car-albums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
/* carousel controls */
.carousel-controls{display:flex;align-items:center;justify-content:space-between;padding:.75rem 2rem;border-top:.5px solid var(--border);background:var(--bg2)}
.carousel-dots{display:flex;gap:6px}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:var(--border2);transition:all .2s;cursor:pointer;border:none}
.carousel-dot.active{background:var(--gold);width:18px;border-radius:3px}
.carousel-arrows{display:flex;gap:8px}
.carousel-arrow{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:.5px solid var(--border2);color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s}
.carousel-arrow:hover{border-color:rgba(201,168,76,.4);color:var(--gold)}
.carousel-auto-label{font-size:10px;color:var(--text3);letter-spacing:.06em}

/* ===== ERA ENHANCED ===== */
.era-layout{display:grid;grid-template-columns:1fr 280px;gap:1.5rem;padding:1.5rem 2rem}
@media(max-width:900px){.era-layout{grid-template-columns:1fr}}
.era-main{}
.era-sidebar{}

/* 時代背景パネル */
.context-panel{background:var(--bg2);border:.5px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1.25rem}
.context-panel-title{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:.75rem;font-weight:700}
.context-event{display:flex;gap:.75rem;padding:.6rem 0;border-bottom:.5px solid var(--border);align-items:flex-start}
.context-event:last-child{border-bottom:none}
.context-year{font-family:'EB Garamond',serif;font-size:14px;color:var(--gold);font-weight:600;flex-shrink:0;width:38px}
.context-text{font-size:12px;color:var(--text2);line-height:1.6}

/* アーティストカード（年代別） */
.era-artist-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
.era-artist-card{display:flex;align-items:center;gap:.85rem;padding:.85rem 1rem;background:var(--bg2);border:.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all .18s;text-decoration:none}
.era-artist-card:hover{border-color:rgba(201,168,76,.4);background:var(--bg3);transform:translateX(4px)}
.era-ac-initial{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;flex-shrink:0}
.era-ac-name{font-family:'Shippori Mincho',serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.era-ac-sub{font-size:11px;color:var(--text3)}
.era-ac-arrow{margin-left:auto;color:var(--text4);font-size:14px;transition:all .18s}
.era-artist-card:hover .era-ac-arrow{color:var(--gold)}
@media(max-width:760px){.nav{padding:.9rem 1.5rem}.hero,.content,.search-zone,.carousel-artist-header,.car-albums,.carousel-controls,.era-layout{padding-left:1.5rem;padding-right:1.5rem}.explore-tabs{padding:0 1.5rem}.albums-grid,.car-albums-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
</style>
</head>
<body>
<nav class="nav">
  <span class="nav-logo">時代 Archive</span>
  <div class="nav-bc"><a href="music.html" id="bc-music">音楽</a><span class="sep">›</span><span id="bc-genre" style="color:var(--text2)">ジャンル</span></div>
</nav>
<div class="hero">
  <div class="hero-wm" id="hero-wm">音</div>
  <div class="hero-eyebrow" id="hero-eyebrow">JAPANESE MUSIC</div>
  <h1 class="hero-title" id="hero-title">読み込み中...</h1>
  <p class="hero-desc" id="hero-desc"></p>
  <div class="hero-tags" id="hero-tags"></div>
  <div class="genre-info-bar" id="genre-info-bar" style="display:none"></div>
</div>
<div class="explore-tabs">
  <button class="etab active" id="tab-recommend" onclick="switchTab('recommend')">おすすめ</button>
  <button class="etab" id="tab-search" onclick="switchTab('search')">全アーティスト検索</button>
  <button class="etab" id="tab-era" onclick="switchTab('era')">年代別</button>
</div>
<!-- おすすめ（カルーセル） -->
<div id="view-recommend">
  <div class="carousel-outer">
    <div class="carousel-track" id="carousel-track"></div>
    <div class="carousel-controls">
      <div>
        <div class="carousel-auto-label" id="carousel-auto-label">▶ 自動再生中</div>
      </div>
      <div class="carousel-dots" id="carousel-dots"></div>
      <div class="carousel-arrows">
        <button class="carousel-arrow" onclick="carouselPrev()">←</button>
        <button class="carousel-arrow" onclick="carouselNext()">→</button>
      </div>
    </div>
  </div>
</div>
<!-- 全アーティスト検索 -->
<div id="view-search" style="display:none">
  <div class="search-zone">
    <div class="search-wrap">
      <input class="search-input" id="artist-search-input" type="text" placeholder="アーティスト名を入力..." oninput="onArtistSearch()" onkeydown="if(event.key==='Enter'&&!event.isComposing)goToArtist()">
      <button class="search-btn" onclick="goToArtist()">検索</button>
    </div>
    <div id="artist-search-results"></div>
    <a class="all-artists-link" id="all-artists-link" href="artists.html">全アーティスト一覧を見る →</a>
  </div>
</div>
<!-- 年代別（強化版） -->
<div id="view-era" style="display:none">
  <div class="era-tabs" id="era-tabs"></div>
  <div class="era-layout">
    <div class="era-main">
      <div id="era-header-area"></div>
      <div class="loading" id="loading-era"><div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div><div class="ld-text">読み込み中...</div></div>
      <div class="error-msg" id="error-era"></div>
      <div id="era-artist-cards-area"></div>
      <div class="sec-lbl" id="albums-label-era" style="display:none">代表アルバム</div>
      <div class="albums-grid" id="albums-grid-era"></div>
    </div>
    <div class="era-sidebar">
      <div id="era-context-panel"></div>
    </div>
  </div>
</div>
<script>
const API_BASE = 'https://jidai-archive-next.vercel.app';
const params = new URLSearchParams(location.search);
const genreId = params.get('genre') || '';

// ─── ジャンル設定 ───────────────────────────────────────
const GENRE_CONFIG = {
  jpop:{name:'J-POP',wm:'J',eyebrow:'1990S — PRESENT · JAPAN',
    desc:'1990年代のCD黄金期に社会現象を起こした日本の大衆音楽。宇多田ヒカル・Mr.Children・DREAMS COME TRUEなど、キャッチーなメロディと日本語の歌詞が特徴。',
    tags:['1990年代〜','CD黄金期','ドラマタイアップ'],
    info:'J-POPは「Japanese Pop」の略。<strong>歌謡曲・ロック・R&Bなど様々なジャンルが混ざり合った</strong>包括的なジャンルです。90年代のCD黄金期に確立され、現在もJ-POPという呼称は幅広い日本の大衆音楽を指します。',
    recommend:[
      {name:'宇多田ヒカル',nameEn:'Hikaru Utada',desc:'16歳でデビュー。ファーストアルバム「First Love」が760万枚を記録したJ-POP史上最大のヒットメーカー。'},
      {name:'Mr.Children',nameEn:'Mr.Children',desc:'「Tomorrow never knows」「名もなき詩」など90年代を代表する国民的バンド。'},
      {name:'DREAMS COME TRUE',nameEn:'Dreams Come True',desc:'「LOVE LOVE LOVE」「未来予想図Ⅱ」などポップな名曲を量産したユニット。'},
      {name:'globe',nameEn:'globe',desc:'小室哲哉プロデュース。90年代後半を席巻したテクノポップユニット。'},
      {name:'SMAP',nameEn:'SMAP',desc:'「世界に一つだけの花」「夜空ノムコウ」など老若男女に愛される楽曲多数。'},
    ],
    years:[
      {era:'1990年代前半',key:'90s-early',title:'J-POPの確立',sub:'小室哲哉がプロデューサーとして台頭。ドラマタイアップが流行する時期。',keywords:['ドラマタイアップ','小室ファミリー','バンドブーム終焉'],artists:[{jp:'DREAMS COME TRUE',en:'Dreams Come True'},{jp:'Mr.Children',en:'Mr.Children'}]},
      {era:'1990年代後半',key:'90s-late',title:'CD黄金期',sub:'宇多田ヒカル・浜崎あゆみ・globeが登場。CDシングルがミリオン連発した時代。',keywords:['ミリオンヒット','宇多田ヒカル','浜崎あゆみ'],artists:[{jp:'宇多田ヒカル',en:'Hikaru Utada'},{jp:'globe',en:'globe'}]},
      {era:'2010年代〜現在',key:'2010s',title:'ストリーミングと新世代',sub:'YOASOBIや米津玄師など、ネット発のアーティストが台頭。',keywords:['ストリーミング','YOASOBI','米津玄師'],artists:[{jp:'米津玄師',en:'Kenshi Yonezu'}]},
    ],
    localArtists:[
      {name:'宇多田ヒカル',nameEn:'Hikaru Utada'},{name:'Mr.Children',nameEn:'Mr.Children'},
      {name:'DREAMS COME TRUE',nameEn:'Dreams Come True'},{name:'globe',nameEn:'globe'},
      {name:'SMAP',nameEn:'SMAP'},{name:'浜崎あゆみ',nameEn:'Ayumi Hamasaki'},
      {name:'槇原敬之',nameEn:'Noriyuki Makihara'},{name:'ZARD',nameEn:'ZARD'},

function switchTab(tab) {
  ['recommend','search','era'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('view-'+t).style.display = t===tab ? 'block' : 'none';
  });
  if (tab==='era') {
    const activeEra = document.querySelector('.eratab.active');
    if (activeEra) {
      const match = activeEra.getAttribute('onclick').match(/'([^']+)'/);
      if (match) loadEra(activeEra, match[1]);
    }
  }
}

let carIdx = 0;
let carTotal = 0;
let carAutoTimer = null;

async function buildCarousel() {
  const track = document.getElementById('carousel-track');
  const dots = document.getElementById('carousel-dots');
  carTotal = cfg.recommend.length;

  // 全スライドを非同期で構築
  for (let i = 0; i < cfg.recommend.length; i++) {
    const a = cfg.recommend[i];
    const slide = document.createElement('div');
    slide.className = 'carousel-slide';
    slide.style.width = '100%';

    const detailUrl = 'artist.html?name='+encodeURIComponent(a.name)+'&en='+encodeURIComponent(a.nameEn||'')+'&category=musician';
    const bgColors = ['rgba(201,168,76,.18)','rgba(138,180,212,.18)','rgba(80,200,140,.18)','rgba(212,83,126,.18)','rgba(127,119,221,.18)'];
    const textColors = ['#c9a84c','#8ab4d4','#5dcaa5','#ed93b1','#9d98dd'];
    const ci = i % bgColors.length;

    slide.innerHTML = `
      <div class="carousel-artist-header">
        <div class="car-avatar" style="background:${bgColors[ci]};color:${textColors[ci]}">${a.name.charAt(0)}</div>
        <div class="car-info">
          <a class="car-name" href="${detailUrl}" style="color:var(--text);text-decoration:none;display:block;transition:color .15s" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text)'">${a.name}</a>
          <div class="car-desc">${a.desc}</div>
          <div class="car-links">
            <a class="car-link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(a.name)}" target="_blank" style="background:rgba(255,60,60,.08);border-color:rgba(255,60,60,.25);color:#ff8888">YouTube</a>
            <a class="car-link" href="https://open.spotify.com/search/${encodeURIComponent(a.nameEn||a.name)}" target="_blank" style="background:rgba(29,185,84,.08);border-color:rgba(29,185,84,.25);color:#1db954">Spotify</a>
            <a class="car-link" href="https://music.apple.com/jp/search?term=${encodeURIComponent(a.name)}" target="_blank" style="background:rgba(252,60,68,.07);border-color:rgba(252,60,68,.2);color:#fc8888">Apple Music</a>
            <a class="car-detail-btn" href="${detailUrl}">詳細ページを見る →</a>
          </div>
        </div>
      </div>
      <div class="car-albums">
        <div class="car-albums-label">アルバム・シングル</div>
        <div class="car-albums-grid" id="car-grid-${i}">
          <div style="color:var(--text3);font-size:12px;padding:.5rem 0">読み込み中...</div>
        </div>
      </div>`;
    track.appendChild(slide);

    // ドット
    const dot = document.createElement('button');
    dot.className = 'carousel-dot' + (i===0?' active':'');
    dot.onclick = () => goToSlide(i);
    dots.appendChild(dot);
  }

  // track幅を設定
  track.style.width = (carTotal * 100) + '%';
  track.querySelectorAll('.carousel-slide').forEach(s => s.style.width = (100/carTotal)+'%');

  // 最初のアルバムをロード
  loadCarouselAlbums(0);

  // 自動再生
  startAutoPlay();
}

async function loadCarouselAlbums(idx) {
  const a = cfg.recommend[idx];
  const grid = document.getElementById('car-grid-'+idx);
  if (!grid || grid.dataset.loaded) return;
  grid.dataset.loaded = '1';
  const albums = await fetchAlbums(a.name, a.nameEn);
  grid.innerHTML = '';
  if (!albums.length) { grid.innerHTML='<div style="color:var(--text3);font-size:12px">アルバムが見つかりませんでした</div>'; return; }
  albums.slice(0,8).forEach(album => {
    const title = album.collectionName||'';
    const img = (album.artworkUrl100||'').replace('100x100bb','400x400bb');
    const year = album.releaseDate?album.releaseDate.substring(0,4):'';
    const itunesUrl = album.collectionViewUrl||'#';
    const spQ = encodeURIComponent(title+' '+(a.nameEn||a.name));
    const ytQ = encodeURIComponent(a.name+' '+title);
    const card = document.createElement('div');
    card.className = 'album-card fade-in';
    card.innerHTML = `${img?`<img class="album-jacket" src="${img}" alt="${title}" loading="lazy" onerror="this.outerHTML='<div class=album-jacket-ph>🎵</div>'">`:`<div class="album-jacket-ph">🎵</div>`}<div class="album-body"><div class="album-name">${title}</div><div class="album-year">${year}</div><div class="album-links"><a class="alnk" href="${itunesUrl}" target="_blank" style="background:rgba(252,60,68,.07);border-color:rgba(252,60,68,.2);color:#fc8888">AM</a><a class="alnk" href="https://open.spotify.com/search/${spQ}" target="_blank" style="background:rgba(29,185,84,.08);border-color:rgba(29,185,84,.25);color:#1db954">SP</a><a class="alnk" href="https://www.youtube.com/results?search_query=${ytQ}" target="_blank" style="background:rgba(255,60,60,.08);border-color:rgba(255,60,60,.25);color:#ff8888">YT</a></div></div>`;
    grid.appendChild(card);
  });
}

function goToSlide(idx) {
  carIdx = ((idx % carTotal) + carTotal) % carTotal;
  const track = document.getElementById('carousel-track');
  track.style.transform = `translateX(-${(carIdx/carTotal)*100}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d,i)=>d.classList.toggle('active',i===carIdx));
  // 次のスライドのアルバムをプリロード
  loadCarouselAlbums(carIdx);
  loadCarouselAlbums((carIdx+1)%carTotal);
}

function carouselNext() { goToSlide(carIdx+1); }
function carouselPrev() { goToSlide(carIdx-1); }

function startAutoPlay() {
  clearInterval(carAutoTimer);
  carAutoTimer = setInterval(() => { carouselNext(); }, 6000);
  document.getElementById('carousel-auto-label').textContent = '▶ 自動再生中';
}

// タッチスワイプ対応
(function(){
  let sx=0;
  const el=document.getElementById('carousel-track');
  if(!el)return;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  el.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>50){dx<0?carouselNext():carouselPrev();}
  },{passive:true});
})();

function onArtistSearch() {
  const q = document.getElementById('artist-search-input').value.trim();
  const results = document.getElementById('artist-search-results');
  if (q.length===0) { results.innerHTML=''; return; }
  const matched = cfg.localArtists.filter(a=>a.name.includes(q)||a.nameEn.toLowerCase().includes(q.toLowerCase()));
  if (matched.length>0) {
    results.innerHTML = matched.map(a=>
      '<a class="search-result-item" href="artist.html?name='+encodeURIComponent(a.name)+'&en='+encodeURIComponent(a.nameEn)+'&category=musician">'+a.name+
      ' <span style="font-size:11px;color:var(--text3);font-family:\'Zen Kaku Gothic New\',sans-serif;font-weight:400">'+a.nameEn+'</span></a>'
    ).join('');
  } else {
    results.innerHTML='<div class="search-no-result">一覧にないアーティストは → <a href="artist.html?name='+encodeURIComponent(q)+'&genre='+encodeURIComponent(genreId)+'" style="color:var(--gold);text-decoration:none">AIでページを生成する</a></div>';
    // adminに送信
    sendToAdmin(q);
  }
}

function goToArtist() {
  const q = document.getElementById('artist-search-input').value.trim();
  if (!q) return;
  const matched = cfg.localArtists.find(a=>a.name.includes(q)||a.nameEn.toLowerCase().includes(q.toLowerCase()));
  if (matched) {
    window.location.href='artist.html?name='+encodeURIComponent(matched.name)+'&en='+encodeURIComponent(matched.nameEn)+'&category=musician';
  } else {
    sendToAdmin(q);
    window.location.href='artist.html?name='+encodeURIComponent(q)+'&genre='+encodeURIComponent(genreId);
  }
}

async function sendToAdmin(name) {
  try {
    await fetch(API_BASE+'/api/artists', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, genre:cfg.name, requestedGenre:genreId, addedAt:new Date().toISOString()})
    });
  } catch(e) {}
}

  // アーティストカード
  const bgColors=['rgba(201,168,76,.18)','rgba(138,180,212,.18)','rgba(80,200,140,.18)','rgba(212,83,126,.18)','rgba(127,119,221,.18)'];
  const textColors=['#c9a84c','#8ab4d4','#5dcaa5','#ed93b1','#9d98dd'];
  const cardsEl=document.getElementById('era-artist-cards-area');
  if(era.artists&&era.artists.length>0){
    const label=document.createElement('div');label.className='sec-lbl';label.textContent='この時代のアーティスト';label.style.marginBottom='.75rem';
    cardsEl.appendChild(label);
    const cardsWrap=document.createElement('div');cardsWrap.className='era-artist-cards';
    era.artists.forEach((artist,i)=>{
      const ci=i%bgColors.length;
      const url='artist.html?name='+encodeURIComponent(artist.jp)+'&en='+encodeURIComponent(artist.en||'')+'&category=musician';
      const card=document.createElement('a');card.className='era-artist-card';card.href=url;
      card.innerHTML=`<div class="era-ac-initial" style="background:${bgColors[ci]};color:${textColors[ci]}">${artist.jp.charAt(0)}</div><div><div class="era-ac-name">${artist.jp}</div><div class="era-ac-sub">${artist.en||''}</div></div><span class="era-ac-arrow">→</span>`;
      cardsWrap.appendChild(card);
    });
    cardsEl.appendChild(cardsWrap);
  }

  // 社会的背景サイドパネル
  const contextData = ERA_CONTEXT[eraKey] || [];
  if(contextData.length>0){
    const panel=document.getElementById('era-context-panel');
    panel.innerHTML=`<div class="context-panel"><div class="context-panel-title">🗓 時代の背景</div>${contextData.map(e=>`<div class="context-event"><div class="context-year">${e.y}</div><div class="context-text">${e.t}</div></div>`).join('')}</div>`;
  }

  // アルバム
  const allAlbums=[];
  for (const artist of era.artists) {
    const albums = await fetchAlbums(artist.jp, artist.en);
    albums.slice(0,4).forEach(a=>{a._artistJP=artist.jp;a._artistEN=artist.en;allAlbums.push(a);});
  }
  hideLoading('era');
  renderAlbums(allAlbums,'era');
}

// ─── iTunes API ───────────────────────────────────────
async function fetchAlbums(artistJP, artistEN) {
  try {
    const res=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(artistJP)+'&country=JP&media=music&entity=album&limit=10&lang=ja_jp');
    const data=await res.json();
    let albums=data.results||[];
    if(albums.length===0&&artistEN){
      const res2=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(artistEN)+'&country=JP&media=music&entity=album&limit=10');
      const data2=await res2.json();albums=data2.results||[];
    }
    const seen=new Set();
    return albums.filter(a=>{const k=(a.collectionName||'').toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  } catch(e){return[];}
}

async function fetchAndRenderAlbums(artistJP, artistEN, mode) {
  const albums=await fetchAlbums(artistJP,artistEN);
  hideLoading(mode);
  if(albums.length===0){showError(mode,'アルバムが見つかりませんでした。');return;}
  albums.forEach(a=>{a._artistJP=artistJP;a._artistEN=artistEN;});
  renderAlbums(albums.slice(0,16),mode);
}

function renderAlbums(albums, mode) {
  const grid=document.getElementById('albums-grid-'+mode);
  const label=document.getElementById('albums-label-'+mode);
  grid.innerHTML='';
  if(albums.length===0){showError(mode,'アルバムが見つかりませんでした。');return;}
  label.style.display='flex';
  albums.forEach(album=>{
    const title=album.collectionName||'';
    const img=(album.artworkUrl100||'').replace('100x100bb','400x400bb');
    const year=album.releaseDate?album.releaseDate.substring(0,4):'';
    const itunesUrl=album.collectionViewUrl||'#';
    const artistJP=album._artistJP||'';
    const artistEN=album._artistEN||'';
    const ytQ=encodeURIComponent(artistJP+' '+title);
    const spQ=encodeURIComponent(title+' '+(artistEN||artistJP));
    const card=document.createElement('div');
    card.className='album-card fade-in';
    card.innerHTML=`${img?`<img class="album-jacket" src="${img}" alt="${title}" loading="lazy" onerror="this.outerHTML='<div class=album-jacket-ph>🎵</div>'">`:`<div class="album-jacket-ph">🎵</div>`}<div class="album-body"><div class="album-name">${title}</div>${mode==='era'?`<div class="album-artist">${artistJP}</div>`:''}<div class="album-year">${year}</div><div class="album-links"><a class="alnk" href="${itunesUrl}" target="_blank" style="background:rgba(252,60,68,.07);border-color:rgba(252,60,68,.2);color:#fc8888">AM</a><a class="alnk" href="https://open.spotify.com/search/${spQ}" target="_blank" style="background:rgba(29,185,84,.08);border-color:rgba(29,185,84,.25);color:#1db954">SP</a><a class="alnk" href="https://www.youtube.com/results?search_query=${ytQ}" target="_blank" style="background:rgba(255,60,60,.08);border-color:rgba(255,60,60,.25);color:#ff8888">YT</a></div></div>`;
    grid.appendChild(card);
  });
}

// ─── UI helpers ──────────────────────────────────────
function showLoading(mode,msg){if(document.getElementById('ld-text-'+mode))document.getElementById('ld-text-'+mode).textContent=msg;document.getElementById('loading-'+mode).classList.add('show');}
function hideLoading(mode){document.getElementById('loading-'+mode).classList.remove('show');}
function showError(mode,msg){hideLoading(mode);const el=document.getElementById('error-'+mode);el.textContent=msg;el.classList.add('show');}
function hideError(mode){document.getElementById('error-'+mode).classList.remove('show');}

// ─── INIT ────────────────────────────────────────────
buildCarousel();
buildEraTabs();
</script>
