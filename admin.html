<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時代 Archive — 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--bg2:#0c0e1a;--bg3:#111320;--text:#e8e4d9;--text2:rgba(232,228,217,.5);--text3:rgba(232,228,217,.28);--gold:#c9a84c;--border:rgba(232,228,217,.08);--border2:rgba(232,228,217,.15);--radius:8px;--green:#4caf7d;--red:#e05555}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;padding-bottom:5rem}

.nav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;border-bottom:.5px solid var(--border);background:rgba(7,8,15,.95)}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;letter-spacing:.1em;color:var(--gold);text-decoration:none}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-badge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:3px;background:rgba(201,168,76,.15);border:.5px solid rgba(201,168,76,.3);color:var(--gold)}
.logout-btn{font-size:11px;padding:4px 10px;border-radius:3px;border:.5px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif}
.logout-btn:hover{border-color:var(--red);color:var(--red)}

.login-zone{max-width:400px;margin:4rem auto;padding:2rem;background:var(--bg2);border:.5px solid var(--border2);border-radius:12px;text-align:center}
.login-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;color:var(--text);margin-bottom:.5rem}
.login-sub{font-size:12px;color:var(--text2);margin-bottom:1.5rem}
.login-input{width:100%;background:var(--bg);border:.5px solid var(--border2);border-radius:6px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;padding:10px 14px;outline:none;margin-bottom:1rem;transition:border-color .2s}
.login-input:focus{border-color:rgba(201,168,76,.5)}
.login-input::placeholder{color:var(--text3)}
.login-btn{width:100%;background:var(--gold);color:#07080f;border:none;border-radius:6px;padding:11px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.login-btn:hover{background:#e0be6a}
.login-error{font-size:12px;color:var(--red);margin-top:.5rem;display:none}

.main{padding:2rem;display:none}
.page-title{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:.4rem}
.page-sub{font-size:12px;color:var(--text2);margin-bottom:2rem}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:2rem}
.stat-box{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:1rem;text-align:center}
.stat-num{font-family:'Shippori Mincho',serif;font-size:28px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:3px}

.tabs{display:flex;gap:0;border-bottom:.5px solid var(--border);margin-bottom:1.5rem}
.tab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:1.5px solid transparent;transition:all .18s;font-family:'Zen Kaku Gothic New',sans-serif}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:rgba(201,168,76,.6)}

.sec-lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.sec-lbl::after{content:'';flex:1;height:.5px;background:var(--border)}

.pending-list{display:flex;flex-direction:column;gap:8px;margin-bottom:2rem}
.pending-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.15rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center}
.pc-name{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:3px}
.pc-sub{font-size:11px;color:var(--text2)}
.pc-genre{font-size:10px;padding:2px 8px;border-radius:10px;border:.5px solid rgba(201,168,76,.25);color:rgba(201,168,76,.7);display:inline-block;margin-top:4px}
.pc-actions{display:flex;gap:6px;flex-shrink:0}
.btn-approve{background:rgba(76,175,125,.15);border:.5px solid rgba(76,175,125,.4);color:#4caf7d;padding:6px 14px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;transition:all .18s;white-space:nowrap}
.btn-approve:hover{background:rgba(76,175,125,.25)}
.btn-reject{background:rgba(224,85,85,.1);border:.5px solid rgba(224,85,85,.3);color:var(--red);padding:6px 14px;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;transition:all .18s;white-space:nowrap}
.btn-reject:hover{background:rgba(224,85,85,.2)}
.btn-revoke{background:rgba(224,85,85,.08);border:.5px solid rgba(224,85,85,.2);color:rgba(224,85,85,.7);padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;transition:all .18s;white-space:nowrap}
.btn-revoke:hover{background:rgba(224,85,85,.18)}

.approved-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden}
.approved-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:.75rem 1rem;background:var(--bg2);transition:background .15s}
.approved-row:hover{background:var(--bg3)}
.ar-left{display:flex;flex-direction:column;gap:2px}
.ar-name{font-family:'Shippori Mincho',serif;font-size:14px;font-weight:700;color:var(--text)}
.ar-sub{font-size:11px;color:var(--text3)}
.ar-right{display:flex;align-items:center;gap:8px}
.ar-genre{font-size:10px;padding:2px 8px;border-radius:10px;border:.5px solid rgba(201,168,76,.2);color:rgba(201,168,76,.6)}

.empty{padding:2rem;text-align:center;font-size:13px;color:var(--text3)}

.toast{position:fixed;bottom:2rem;right:2rem;background:var(--bg2);border:.5px solid rgba(76,175,125,.4);border-radius:8px;padding:.75rem 1.25rem;font-size:13px;color:#4caf7d;display:none;z-index:999;max-width:300px}
.toast.show{display:block}
.toast.error{border-color:rgba(224,85,85,.4);color:var(--red)}

.loading{padding:2rem;text-align:center}
.ld-dots{display:flex;gap:6px;justify-content:center;margin-bottom:.5rem}
.ld-dot{width:7px;height:7px;border-radius:50%;background:rgba(201,168,76,.4);animation:ldp 1.2s ease-in-out infinite}
.ld-dot:nth-child(2){animation-delay:.2s}.ld-dot:nth-child(3){animation-delay:.4s}
@keyframes ldp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.change-key-btn{font-size:11px;padding:4px 10px;border-radius:3px;border:.5px solid rgba(201,168,76,.3);background:transparent;color:rgba(201,168,76,.7);cursor:pointer;font-family:"Zen Kaku Gothic New",sans-serif;transition:all .18s}
.change-key-btn:hover{border-color:var(--gold);color:var(--gold)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;pointer-events:none}
.modal-overlay.show{display:flex;pointer-events:all}
.modal{background:var(--bg2);border:.5px solid var(--border2);border-radius:12px;padding:2rem;width:100%;max-width:400px;margin:1rem}
.modal-title{font-family:"Shippori Mincho",serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:.4rem}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:1.5rem;line-height:1.7}
.modal-input{width:100%;background:var(--bg);border:.5px solid var(--border2);border-radius:6px;color:var(--text);font-family:"Zen Kaku Gothic New",sans-serif;font-size:14px;padding:10px 14px;outline:none;margin-bottom:.75rem;transition:border-color .2s}
.modal-input:focus{border-color:rgba(201,168,76,.5)}
.modal-input::placeholder{color:var(--text3)}
.modal-row{display:flex;gap:8px;margin-top:.5rem}
.modal-btn{flex:1;padding:10px;border-radius:6px;font-family:"Zen Kaku Gothic New",sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .18s}
.modal-btn-primary{background:var(--gold);color:#07080f}
.modal-btn-primary:hover{background:#e0be6a}
.modal-btn-secondary{background:transparent;border:.5px solid var(--border2);color:var(--text2)}
.modal-btn-secondary:hover{border-color:var(--border2);color:var(--text)}
.modal-error{font-size:12px;color:var(--red);margin-top:.5rem;display:none}
.modal-success{font-size:12px;color:var(--green);margin-top:.5rem;display:none}
.modal-step{display:none}
.modal-step.active{display:block}

</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">時代 Archive</a>
  <div class="nav-right">
    <span class="nav-badge">管理画面</span>
    <button class="change-key-btn" id="change-key-btn" onclick="openChangeKey()" style="display:none">🔑 キー変更</button>
    <button class="logout-btn" id="logout-btn" onclick="logout()" style="display:none">ログアウト</button>
  </div>
</nav>

<div id="login-zone" class="login-zone">
  <div class="login-title">管理者ログイン</div>
  <div class="login-sub">管理者キーを入力してください</div>
  <input class="login-input" id="admin-key-input" type="password" placeholder="管理者キー" onkeydown="if(event.key==='Enter')login()"/>
  <button class="login-btn" onclick="login()">ログイン</button>
  <div class="login-error" id="login-error">管理者キーが正しくありません</div>
</div>

<div class="main" id="main">
  <div class="page-title">管理画面</div>
  <div class="page-sub">アーティスト・アニメ作品の承認・管理ができます</div>

  <div class="tabs" style="margin-bottom:1.5rem">
    <button class="tab active" id="sec-btn-music" onclick="switchSection('music')">🎵 音楽アーティスト</button>
    <button class="tab" id="sec-btn-anime" onclick="switchSection('anime')">📺 アニメ作品</button>
  </div>

  <div id="section-music">
  <!-- 音楽ジャンルタブ -->
  <div class="tabs" style="margin-bottom:1rem">
    <button class="tab active" onclick="setMusicGenre(this,'all')">すべて</button>
    <button class="tab" onclick="setMusicGenre(this,'citypop')">シティポップ</button>
    <button class="tab" onclick="setMusicGenre(this,'jpop')">J-POP</button>
    <button class="tab" onclick="setMusicGenre(this,'jrock')">J-ROCK</button>
    <button class="tab" onclick="setMusicGenre(this,'enka')">演歌</button>
    <button class="tab" onclick="setMusicGenre(this,'kayoukyoku')">歌謡曲</button>
    <button class="tab" onclick="setMusicGenre(this,'newmusic')">ニューミュージック</button>
    <button class="tab" onclick="setMusicGenre(this,'idol')">アイドル</button>
    <button class="tab" onclick="setMusicGenre(this,'fusion')">フュージョン</button>
    <button class="tab" onclick="setMusicGenre(this,'technopop')">テクノポップ</button>
    <button class="tab" onclick="setMusicGenre(this,'vocaloid')">ボカロ</button>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="stat-pending">—</div><div class="stat-lbl">承認待ち</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-approved">—</div><div class="stat-lbl">承認済み</div></div>
    <div class="stat-box"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">合計</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab(this,'pending')">承認待ち</button>
    <button class="tab" onclick="setTab(this,'approved')">承認済み</button>
  </div>

  <div id="tab-pending">
    <div class="sec-lbl" id="music-pending-label">承認待ちアーティスト</div>
    <div id="pending-loading" class="loading"><div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div></div>
    <div class="pending-list" id="pending-list"></div>
  </div>

  <div id="tab-approved" style="display:none">
    <div class="sec-lbl">承認済みアーティスト — 取り消しも可能</div>
    <div id="approved-loading" class="loading"><div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div></div>
    <div class="approved-list" id="approved-list"></div>
  </div>
  </div><!-- /section-music -->

  <!-- ===== アニメセクション ===== -->
  <div id="section-anime" style="display:none">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num" id="a-stat-pending">—</div><div class="stat-lbl">承認待ち</div></div>
      <div class="stat-box"><div class="stat-num" id="a-stat-approved">—</div><div class="stat-lbl">承認済み</div></div>
      <div class="stat-box"><div class="stat-num" id="a-stat-total">—</div><div class="stat-lbl">合計</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setAnimeTab(this,'a-pending')">承認待ち</button>
      <button class="tab" onclick="setAnimeTab(this,'a-approved')">承認済み</button>
    </div>
    <div id="tab-a-pending">
      <div class="sec-lbl">承認待ちアニメ作品リクエスト</div>
      <div id="a-pending-loading" class="loading"><div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div></div>
      <div class="pending-list" id="a-pending-list"></div>
    </div>
    <div id="tab-a-approved" style="display:none">
      <div class="sec-lbl">承認済みアニメ作品</div>
      <div id="a-approved-loading" class="loading"><div class="ld-dots"><div class="ld-dot"></div><div class="ld-dot"></div><div class="ld-dot"></div></div></div>
      <div class="approved-list" id="a-approved-list"></div>
    </div>
  </div><!-- /section-anime -->

</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://jidai-archive-next.vercel.app';
let adminKey = '';

// ページ読み込み時にlocalStorageからキーを復元
window.addEventListener('load', () => {
  const saved = localStorage.getItem('admin_key');
  if (saved) {
    adminKey = saved;
    loadData();
  }
});

function login() {
  const key = document.getElementById('admin-key-input').value.trim();
  if (!key) return;
  adminKey = key;
  loadData();
}

function logout() {
  localStorage.removeItem('admin_key');
  adminKey = '';
  document.getElementById('login-zone').style.display = 'block';
  document.getElementById('main').style.display = 'none';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('change-key-btn').style.display = 'none';
  document.getElementById('admin-key-input').value = '';
}

async function loadData() {
  try {
    const res = await fetch(API_BASE + '/api/artists/pending?key=' + adminKey);
    if (res.status === 401) {
      document.getElementById('login-error').style.display = 'block';
      localStorage.removeItem('admin_key');
      adminKey = '';
      return;
    }
    const pending = await res.json();
    const approvedRes = await fetch(API_BASE + '/api/artists');
    const approved = await approvedRes.json();

    // データを保持
    _allPending = Array.isArray(pending) ? pending : [];
    _allApproved = Array.isArray(approved) ? approved : [];

    // ログイン成功 → localStorageに保存
    localStorage.setItem('admin_key', adminKey);

    document.getElementById('login-zone').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('logout-btn').style.display = 'block';
    document.getElementById('change-key-btn').style.display = 'block';

    // ジャンルフィルタ適用してレンダリング
    filterAndRenderMusic();
  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent = 'エラー: ' + e.message;
    localStorage.removeItem('admin_key');
  }
}

function renderPending(pending) {
  document.getElementById('pending-loading').style.display = 'none';
  const list = document.getElementById('pending-list');
  list.innerHTML = '';
  if (pending.length === 0) {
    list.innerHTML = '<div class="empty">承認待ちのアーティストはいません</div>';
    return;
  }
  pending.forEach(a => {
    const card = document.createElement('div');
    card.className = 'pending-card';
    card.id = 'card-' + a.name;
    card.innerHTML =
      '<div>' +
      '<div class="pc-name">' + a.name + '</div>' +
      '<div class="pc-sub">' + (a.nameEn || '') + ' · ' + (a.era || '') + '</div>' +
      '<span class="pc-genre">' + (a.genre || '') + '</span>' +
      '</div>' +
      '<div class="pc-actions">' +
      '<button class="btn-approve" onclick="approve(\'' + a.name.replace(/'/g, "\\'") + '\')">✓ 承認</button>' +
      '<button class="btn-reject" onclick="reject(\'' + a.name.replace(/'/g, "\\'") + '\')">✗ 却下</button>' +
      '</div>';
    list.appendChild(card);
  });
}

function renderApproved(approved) {
  document.getElementById('approved-loading').style.display = 'none';
  const list = document.getElementById('approved-list');
  list.innerHTML = '';
  if (approved.length === 0) {
    list.innerHTML = '<div class="empty">承認済みのアーティストはいません</div>';
    return;
  }
  approved.forEach(a => {
    const row = document.createElement('div');
    row.className = 'approved-row';
    row.id = 'approved-' + a.name;
    row.innerHTML =
      '<div class="ar-left">' +
      '<div class="ar-name">' + a.name + '</div>' +
      '<div class="ar-sub">' + (a.nameEn || '') + ' · ' + (a.era || '') + '</div>' +
      '</div>' +
      '<div class="ar-right">' +
      '<span class="ar-genre">' + (a.genre || '').split('・')[0] + '</span>' +
      '<button class="btn-revoke" onclick="revoke(\'' + a.name.replace(/'/g, "\\'") + '\')">取り消し</button>' +
      '</div>';
    list.appendChild(row);
  });
}

async function approve(name) {
  try {
    const res = await fetch(API_BASE + '/api/artists/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, action: 'approve', adminKey })
    });
    if (!res.ok) throw new Error('Failed');
    showToast('✓ ' + name + ' を承認しました');
    document.getElementById('card-' + name)?.remove();
    updateStats(-1, 1);
  } catch(e) { showToast('エラー: ' + e.message, true); }
}

async function reject(name) {
  try {
    const res = await fetch(API_BASE + '/api/artists/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, action: 'reject', adminKey })
    });
    if (!res.ok) throw new Error('Failed');
    showToast('✗ ' + name + ' を却下しました');
    document.getElementById('card-' + name)?.remove();
    updateStats(-1, 0);
  } catch(e) { showToast('エラー: ' + e.message, true); }
}

async function revoke(name) {
  if (!confirm(name + ' の承認を取り消しますか？')) return;
  try {
    const res = await fetch(API_BASE + '/api/artists/approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, action: 'revoke', adminKey })
    });
    if (!res.ok) throw new Error('Failed');
    showToast('↩ ' + name + ' の承認を取り消しました');
    document.getElementById('approved-' + name)?.remove();
    updateStats(0, -1);
  } catch(e) { showToast('エラー: ' + e.message, true); }
}

function updateStats(pendingDelta, approvedDelta) {
  const p = parseInt(document.getElementById('stat-pending').textContent) + pendingDelta;
  const a = parseInt(document.getElementById('stat-approved').textContent) + approvedDelta;
  document.getElementById('stat-pending').textContent = Math.max(0, p);
  document.getElementById('stat-approved').textContent = Math.max(0, a);
  document.getElementById('stat-total').textContent = Math.max(0, p) + Math.max(0, a);
}



function openChangeKey() {
  document.getElementById('change-key-modal').classList.add('show');
  document.querySelectorAll('.modal-step').forEach(s => s.classList.remove('active'));
  document.getElementById('ck-step1').classList.add('active');
  document.getElementById('ck-err1').style.display = 'none';
}

function closeChangeKey() {
  document.getElementById('change-key-modal').classList.remove('show');
}

async function sendChangeCode() {
  const err = document.getElementById('ck-err1');
  err.style.display = 'none';
  try {
    const res = await fetch(API_BASE + '/api/admin/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'エラーが発生しました'; err.style.display = 'block'; return; }
    document.querySelectorAll('.modal-step').forEach(s => s.classList.remove('active'));
    document.getElementById('ck-step2').classList.add('active');
  } catch(e) { err.textContent = 'エラー: ' + e.message; err.style.display = 'block'; }
}

async function submitChangeKey() {
  const err = document.getElementById('ck-err2');
  err.style.display = 'none';
  const code = document.getElementById('ck-code').value.trim();
  const newKey = document.getElementById('ck-newkey').value;
  const newKey2 = document.getElementById('ck-newkey2').value;
  if (!code || code.length !== 6) { err.textContent = '6桁のコードを入力してください'; err.style.display = 'block'; return; }
  if (newKey.length < 8) { err.textContent = 'キーは8文字以上にしてください'; err.style.display = 'block'; return; }
  if (newKey !== newKey2) { err.textContent = '新しいキーが一致しません'; err.style.display = 'block'; return; }
  try {
    const res = await fetch(API_BASE + '/api/admin/change-key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey, code, newKey })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'エラーが発生しました'; err.style.display = 'block'; return; }
    document.querySelectorAll('.modal-step').forEach(s => s.classList.remove('active'));
    document.getElementById('ck-step3').classList.add('active');
  } catch(e) { err.textContent = 'エラー: ' + e.message; err.style.display = 'block'; }
}


// 音楽ジャンルキーワードマッピング
const MUSIC_GENRE_KEYWORDS = {
  all:        [],
  citypop:    ['シティポップ'],
  jpop:       ['ポップス','J-POP','ポップ'],
  jrock:      ['ロック','ハードロック'],
  enka:       ['演歌'],
  kayoukyoku: ['アイドル','フォーク・ポップ'],
  newmusic:   ['ニューミュージック','フォーク'],
  idol:       ['アイドル'],
  fusion:     ['フュージョン','R&B'],
  technopop:  ['テクノポップ','テクノ'],
  vocaloid:   ['テクノポップ','テクノ'],
};

let currentMusicGenre = 'all';
let _allPending = [];
let _allApproved = [];

function setMusicGenre(btn, genre) {
  document.querySelectorAll('#section-music .tabs:first-of-type .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMusicGenre = genre;
  filterAndRenderMusic();
}

function filterAndRenderMusic() {
  const keywords = MUSIC_GENRE_KEYWORDS[currentMusicGenre] || [];
  const matchArtist = (a) => {
    if (currentMusicGenre === 'all') return true;
    // requestedGenreのID一致（最優先）
    if ((a.requestedGenre||'') === currentMusicGenre) return true;
    // genreの日本語名キーワード一致
    if (keywords.some(k => (a.genre||'').includes(k))) return true;
    return false;
  };
  const filteredPending = _allPending.filter(matchArtist);
  const filteredApproved = _allApproved.filter(matchArtist);

  document.getElementById('stat-pending').textContent = filteredPending.length;
  document.getElementById('stat-approved').textContent = filteredApproved.length;
  document.getElementById('stat-total').textContent = filteredPending.length + filteredApproved.length;

  const label = currentMusicGenre === 'all' ? '承認待ちアーティスト（全ジャンル）' : 
    '承認待ちアーティスト — ' + (btn => btn ? btn.textContent : currentMusicGenre)(document.querySelector('#section-music .tabs:first-of-type .tab.active'));
  document.getElementById('music-pending-label').textContent = label;

  renderPending(filteredPending);
  renderApproved(filteredApproved);
}

function switchSection(id) {
  document.getElementById('section-music').style.display = id === 'music' ? 'block' : 'none';
  document.getElementById('section-anime').style.display = id === 'anime' ? 'block' : 'none';
  document.getElementById('sec-btn-music').classList.toggle('active', id === 'music');
  document.getElementById('sec-btn-anime').classList.toggle('active', id === 'anime');
  if (id === 'anime' && !window._animeLoaded) { loadAnimeData(); window._animeLoaded = true; }
}

async function loadAnimeData() {
  try {
    const res = await fetch(API_BASE + '/api/anime/pending?key=' + adminKey);
    const pending = res.ok ? await res.json() : [];
    const res2 = await fetch(API_BASE + '/api/anime/approved?key=' + adminKey);
    const approved = res2.ok ? await res2.json() : [];
    document.getElementById('a-stat-pending').textContent = pending.length;
    document.getElementById('a-stat-approved').textContent = approved.length;
    document.getElementById('a-stat-total').textContent = pending.length + approved.length;
    renderAnimePending(pending);
    renderAnimeApproved(approved);
  } catch(e) {
    document.getElementById('a-pending-loading').innerHTML = '<div style="color:var(--text3);font-size:12px">APIエラー（バックエンド未実装）</div>';
  }
}

function renderAnimePending(list) {
  document.getElementById('a-pending-loading').style.display = 'none';
  const el = document.getElementById('a-pending-list');
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div class="empty">承認待ちのアニメ作品はありません</div>'; return; }
  list.forEach(a => {
    const card = document.createElement('div');
    card.className = 'pending-card';
    card.id = 'acard-' + a.name;
    card.innerHTML = '<div><div class="pc-name">' + a.name + '</div><div class="pc-sub">' + (a.requestedAt ? new Date(a.requestedAt).toLocaleDateString('ja-JP') : '') + '</div></div>' +
      '<div class="pc-actions"><button class="btn-approve" data-name="' + a.name + '" onclick="approveAnime(this.dataset.name)">✓ 承認</button><button class="btn-reject" data-name="' + a.name + '" onclick="rejectAnime(this.dataset.name)">✗ 却下</button></div>';
    el.appendChild(card);
  });
}

function renderAnimeApproved(list) {
  document.getElementById('a-approved-loading').style.display = 'none';
  const el = document.getElementById('a-approved-list');
  el.innerHTML = '';
  if (!list.length) { el.innerHTML = '<div class="empty">承認済みのアニメ作品はありません</div>'; return; }
  list.forEach(a => {
    const row = document.createElement('div');
    row.className = 'approved-row';
    row.innerHTML = '<div class="ar-left"><div class="ar-name">' + a.name + '</div></div>' +
      '<div class="ar-right"><button class="btn-revoke" data-name="' + a.name + '" onclick="revokeAnime(this.dataset.name)">取り消し</button></div>';
    el.appendChild(row);
  });
}

async function approveAnime(name) {
  try {
    await fetch(API_BASE + '/api/anime/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,action:'approve',adminKey}) });
    showToast('✓ ' + name + ' を承認しました');
    document.getElementById('acard-' + name)?.remove();
  } catch(e) { showToast('エラー: ' + e.message, true); }
}

async function rejectAnime(name) {
  try {
    await fetch(API_BASE + '/api/anime/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,action:'reject',adminKey}) });
    showToast('✗ ' + name + ' を却下しました');
    document.getElementById('acard-' + name)?.remove();
  } catch(e) { showToast('エラー: ' + e.message, true); }
}

async function revokeAnime(name) {
  try {
    await fetch(API_BASE + '/api/anime/approve', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,action:'revoke',adminKey}) });
    showToast('取り消しました');
    loadAnimeData();
  } catch(e) { showToast('エラー: ' + e.message, true); }
}

function setAnimeTab(btn, id) {
  btn.closest('.tabs').querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['a-pending','a-approved'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === id ? 'block' : 'none';
  });
}

function setTab(btn, id) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['pending','approved'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === id ? 'block' : 'none';
  });
}

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>

<!-- キー変更モーダル -->
<div class="modal-overlay" id="change-key-modal">
  <div class="modal">
    <div class="modal-title">管理者キーを変更</div>

    <!-- Step 1: メール送信 -->
    <div class="modal-step active" id="ck-step1">
      <div class="modal-sub">登録メールアドレスに確認コードを送信します。</div>
      <div class="modal-row">
        <button class="modal-btn modal-btn-primary" onclick="sendChangeCode()">確認コードを送信</button>
        <button class="modal-btn modal-btn-secondary" onclick="closeChangeKey()">キャンセル</button>
      </div>
      <div class="modal-error" id="ck-err1"></div>
    </div>

    <!-- Step 2: コード入力 + 新キー入力 -->
    <div class="modal-step" id="ck-step2">
      <div class="modal-sub">メールに届いた6桁のコードと新しいキーを入力してください。</div>
      <input class="modal-input" id="ck-code" type="text" placeholder="確認コード（6桁）" maxlength="6"/>
      <input class="modal-input" id="ck-newkey" type="password" placeholder="新しいキー（8文字以上）"/>
      <input class="modal-input" id="ck-newkey2" type="password" placeholder="新しいキー（確認）"/>
      <div class="modal-row">
        <button class="modal-btn modal-btn-primary" onclick="submitChangeKey()">キーを変更する</button>
        <button class="modal-btn modal-btn-secondary" onclick="closeChangeKey()">キャンセル</button>
      </div>
      <div class="modal-error" id="ck-err2"></div>
    </div>

    <!-- Step 3: 完了 -->
    <div class="modal-step" id="ck-step3">
      <div class="modal-sub" style="color:var(--green)">✓ キーを変更しました。次回から新しいキーでログインしてください。</div>
      <div class="modal-row">
        <button class="modal-btn modal-btn-primary" onclick="closeChangeKey();logout()">ログアウトして再ログイン</button>
      </div>
    </div>
  </div>
</div>
