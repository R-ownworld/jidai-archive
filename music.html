<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音楽 — 時代 Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--bg2:#0c0e1a;--bg3:#111320;
  --text:#e8e4d9;--text2:rgba(232,228,217,.5);--text3:rgba(232,228,217,.28);--text4:rgba(232,228,217,.18);
  --gold:#c9a84c;--green:#5dcaa5;--blue:#8ab4d4;--pink:#ed93b1;
  --border:rgba(232,228,217,.08);--border2:rgba(232,228,217,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}

.nav{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2.5rem;border-bottom:.5px solid var(--border);background:rgba(7,8,15,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;color:var(--text)}
.nav-logo .arch{color:var(--gold);font-family:'EB Garamond',serif;font-style:italic;margin-left:.4em}
.nav-menu{display:flex;gap:3rem}
.nav-menu a{font-size:13px;color:var(--text2);letter-spacing:.1em;transition:color .2s}
.nav-menu a:hover,.nav-menu a.active{color:var(--text)}

.hero{padding:4rem 2.5rem 3rem;max-width:1200px;margin:0 auto;border-bottom:.5px solid var(--border)}
.hero-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:1rem;font-weight:700}
.hero-title{font-family:'Shippori Mincho',serif;font-size:clamp(34px,5vw,52px);font-weight:900;line-height:1.18;margin-bottom:.75rem}
.hero-title .accent{color:var(--gold)}
.hero-sub{font-size:14px;color:var(--text2);line-height:2;max-width:560px;margin-bottom:2rem}

.search-row{display:flex;gap:10px;max-width:520px;margin-bottom:.75rem}
.search-input{flex:1;background:rgba(232,228,217,.07);border:.5px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;padding:13px 18px;outline:none;transition:all .2s}
.search-input:focus{border-color:rgba(201,168,76,.5)}
.search-input::placeholder{color:var(--text3)}
.search-btn{background:var(--gold);color:#07080f;border:none;border-radius:10px;padding:13px 22px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:13px;font-weight:900;cursor:pointer;transition:background .18s;white-space:nowrap}
.search-btn:hover{background:#e0be6a}
.search-hint{font-size:11px;color:var(--text3)}

.section{padding:3rem 2.5rem;max-width:1200px;margin:0 auto}
.section-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(201,168,76,.6);margin-bottom:.6rem;font-weight:700}
.section-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;margin-bottom:.5rem}
.section-sub{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:2rem}

.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.genre-card{background:var(--bg2);border:.5px solid var(--border);border-radius:12px;padding:1.75rem 1.6rem 1.5rem;display:flex;flex-direction:column;transition:all .25s;position:relative;overflow:hidden;cursor:pointer}
.genre-card:hover{border-color:rgba(201,168,76,.4);transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.5)}
.genre-card-bg{position:absolute;right:-8px;bottom:-12px;font-size:90px;opacity:.035;pointer-events:none;font-family:'Shippori Mincho',serif;line-height:1}
.genre-icon{font-size:28px;margin-bottom:.85rem}
.genre-name{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:.4rem}
.genre-name-en{font-family:'EB Garamond',serif;font-size:12px;color:var(--text3);letter-spacing:.06em;margin-bottom:.75rem;font-style:italic}
.genre-era{font-size:11px;color:var(--gold);letter-spacing:.04em;margin-bottom:.5rem;font-family:'EB Garamond',serif}
.genre-desc{font-size:12.5px;color:var(--text2);line-height:1.8;margin-bottom:1rem;flex:1}
.genre-artists{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.1rem}
.genre-artist-tag{font-size:10px;padding:2px 9px;border-radius:10px;border:.5px solid var(--border2);color:var(--text2);letter-spacing:.02em}
.genre-cta{font-size:12px;color:var(--gold);letter-spacing:.04em;display:flex;align-items:center;gap:.4rem;border-top:.5px solid var(--border);padding-top:.85rem;transition:gap .2s}
.genre-card:hover .genre-cta{gap:.7rem}
.genre-badge{position:absolute;top:1.25rem;right:1.5rem;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:.5px solid;font-weight:700}
.badge-live{color:var(--green);border-color:rgba(93,202,165,.4);background:rgba(93,202,165,.08)}
.badge-ai{color:var(--text3);border-color:var(--border);background:transparent}

.footer{padding:2rem;border-top:.5px solid var(--border);text-align:center;margin-top:2rem}
.footer-logo{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:700;color:var(--gold);margin-bottom:.4rem}
.footer-sub{font-size:11px;color:var(--text3)}

.fade{animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:760px){
  .nav{padding:.9rem 1.5rem}.nav-menu{gap:1.5rem}
  .hero,.section{padding-left:1.5rem;padding-right:1.5rem}
  .genre-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="home.html">時代<span class="arch">Archive</span></a>
  <div class="nav-menu">
    <a href="music.html" class="active">音楽</a>
    <a href="anime.html">アニメ</a>
    <a href="home.html">検索</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-eyebrow">Music Archive · Japan · 1960s — 2020s</div>
  <h1 class="hero-title">日本の音楽を、<br><span class="accent">ジャンルごと</span>に遡る。</h1>
  <p class="hero-sub">シティポップ、J-POP、演歌、歌謡曲——<br>時代を彩った音楽ジャンルを探索しながら、アーティストや名曲を掘り下げる。</p>
  <div class="search-row">
    <input class="search-input" id="search-input" type="text" placeholder="アーティスト名で検索...">
    <button class="search-btn" onclick="doSearch()">検索</button>
  </div>
  <div class="search-hint">山下達郎・松原みき・美空ひばり など</div>
</section>

<section class="section">
  <div class="section-eyebrow">Browse by Genre</div>
  <h2 class="section-title">ジャンルから探す</h2>
  <p class="section-sub">各ジャンルのカードをクリックすると、代表アーティストや名曲の一覧が見られます。</p>
  <div class="genre-grid" id="genre-grid"></div>
</section>

<footer class="footer">
  <div class="footer-logo">時代 Archive</div>
  <div class="footer-sub">Japan Culture Archive · 1960s — 2020s</div>
</footer>

<script>
const GENRES = [
  {
    id: 'citypop',
    name: 'シティポップ',
    nameEn: 'City Pop',
    icon: '🌆',
    era: '1970s — 1990s',
    desc: '都会的なサウンドと洗練されたメロディが特徴。バブル期に花開き、近年は世界中で再評価されている日本を代表するジャンル。',
    artists: ['山下達郎', '竹内まりや', '松原みき', '角松敏生', '大貫妙子'],
    url: 'index.html',
    status: 'live',
    bg: '都'
  },
  {
    id: 'jpop',
    name: 'J-POP',
    nameEn: 'Japanese Pop',
    icon: '🎤',
    era: '1990s — 現在',
    desc: '1988年にJ-WAVEが命名。CD黄金期の90年代に社会現象を起こし、現在も日本の音楽シーンの中心。キャッチーなメロディと日本語の歌詞が特徴。',
    artists: ['宇多田ヒカル', 'Mr.Children', 'SMAP', 'B\'z', 'globe'],
    url: 'genre-detail.html?genre=jpop',
    status: 'ai',
    bg: 'J'
  },
  {
    id: 'kayoukyoku',
    name: '歌謡曲',
    nameEn: 'Kayōkyoku',
    icon: '🎙',
    era: '1960s — 1980s',
    desc: '昭和を代表する大衆音楽。洋楽の影響を受けた伴奏に日本独自の旋律が乗る。美空ひばりから山口百恵まで、時代を超えた名曲が揃う。',
    artists: ['美空ひばり', '山口百恵', '沢田研二', '西城秀樹', '山本リンダ'],
    url: 'genre-detail.html?genre=kayoukyoku',
    status: 'ai',
    bg: '歌'
  },
  {
    id: 'jrock',
    name: 'J-ROCK',
    nameEn: 'Japanese Rock',
    icon: '🎸',
    era: '1990s — 現在',
    desc: 'バンドサウンドを重視した日本のロック。90年代バンドブームからヴィジュアル系、オルタナまで。B\'z・GLAY・X JAPANが時代を牽引した。',
    artists: ['B\'z', 'GLAY', 'X JAPAN', 'L\'Arc〜en〜Ciel', 'BUCK-TICK'],
    url: 'genre-detail.html?genre=jrock',
    status: 'ai',
    bg: 'R'
  },
  {
    id: 'enka',
    name: '演歌',
    nameEn: 'Enka',
    icon: '🍶',
    era: '1960s — 現在',
    desc: '日本独自の情念と日本音階を用いた歌謡ジャンル。男女の恋路や義理人情を情感たっぷりに表現。こぶしと呼ばれる独特の装飾音が特徴。',
    artists: ['美空ひばり', '北島三郎', '細川たかし', '天童よしみ', '石川さゆり'],
    url: 'genre-detail.html?genre=enka',
    status: 'ai',
    bg: '演'
  },
  {
    id: 'newmusic',
    name: 'ニューミュージック',
    nameEn: 'New Music',
    icon: '🎵',
    era: '1970s — 1980s',
    desc: '70年代フォークソングから発展した、シンガーソングライターによる日本独自のポップス。吉田拓郎・荒井由実（松任谷由実）が牽引した。',
    artists: ['松任谷由実', '吉田拓郎', '井上陽水', '中島みゆき', 'オフコース'],
    url: 'genre-detail.html?genre=newmusic',
    status: 'ai',
    bg: '新'
  },
  {
    id: 'idol',
    name: 'アイドルポップス',
    nameEn: 'Idol Pop',
    icon: '⭐',
    era: '1980s — 現在',
    desc: '可愛らしいビジュアルとキャッチーな楽曲でファンを魅了する日本固有の文化。松田聖子・中森明菜が君臨した80年代から現代のAKBグループまで。',
    artists: ['松田聖子', '中森明菜', '少女時代', 'AKB48', 'モーニング娘。'],
    url: 'genre-detail.html?genre=idol',
    status: 'ai',
    bg: '偶'
  },
  {
    id: 'fusion',
    name: 'フュージョン / AOR',
    nameEn: 'Fusion / AOR',
    icon: '🎷',
    era: '1970s — 1980s',
    desc: 'ジャズとロック・ポップスが融合した都会的サウンド。日本では70〜80年代に独自の発展を遂げ、シティポップと深く関わる洗練されたジャンル。',
    artists: ['渡辺貞夫', 'カシオペア', 'T-SQUARE', '高中正義', '佐藤博'],
    url: 'genre-detail.html?genre=fusion',
    status: 'ai',
    bg: '融'
  },
  {
    id: 'vocaloid',
    name: 'ボカロ',
    nameEn: 'Vocaloid',
    icon: '🤖',
    era: '2000s — 現在',
    desc: 'ヤマハの音声合成技術VOCALOIDを使った音楽文化。初音ミクを筆頭にニコニコ動画から生まれ、米津玄師・YOASOBIら現代J-POPの礎にもなった。',
    artists: ['初音ミク', 'livetune', 'じん', 'DECO*27', 'Supercell'],
    url: 'genre-detail.html?genre=vocaloid',
    status: 'ai',
    bg: 'ボ'
  },
  {
    id: 'technopop',
    name: 'テクノポップ',
    nameEn: 'Techno Pop',
    icon: '🎹',
    era: '1970s — 1980s',
    desc: '電子楽器・シンセサイザーを駆使した未来的サウンド。YMOが世界に先駆けて確立し、坂本龍一・細野晴臣・高橋幸宏の才能が結集したジャンル。',
    artists: ['YMO（イエロー・マジック・オーケストラ）', '坂本龍一', '細野晴臣', 'Perfume', 'きゃりーぱみゅぱみゅ'],
    url: 'genre-detail.html?genre=technopop',
    status: 'ai',
    bg: '電'
  },
];

function buildGrid() {
  const grid = document.getElementById('genre-grid');
  grid.innerHTML = GENRES.map((g, i) => `
    <a class="genre-card fade" href="${g.url}" style="animation-delay:${i * 0.05}s">
      <div class="genre-card-bg">${g.bg}</div>
      ${g.status === 'live'
        ? '<span class="genre-badge badge-live">✓ ページあり</span>'
        : '<span class="genre-badge badge-ai">AI 生成</span>'}
      <div class="genre-icon">${g.icon}</div>
      <div class="genre-name">${g.name}</div>
      <div class="genre-name-en">${g.nameEn}</div>
      <div class="genre-era">${g.era}</div>
      <div class="genre-desc">${g.desc}</div>
      <div class="genre-artists">
        ${g.artists.map(a => `<span class="genre-artist-tag">${a}</span>`).join('')}
      </div>
      <div class="genre-cta">詳細を見る →</div>
    </a>
  `).join('');
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  window.location.href = 'artist.html?name=' + encodeURIComponent(q) + '&category=musician';
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

buildGrid();
</script>
</body>
</html>
